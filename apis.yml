name: Jingle Pay
description: >-
  Jingle Pay is a DFSA-regulated (Dubai Financial Services Authority) digital
  financial services fintech headquartered in the UAE, offering an all-in-one
  mobile money account for cross-border remittances, peer-to-peer payments,
  real-time multi-currency exchange, and Mastercard-powered card payments.
  Founded and led by CEO Amir Fardghassemi, the company serves the UAE,
  Pakistan, Bahrain, and Canada, and reports having processed over $3.5 billion
  across 8M+ transactions to 150 countries for 1.5M+ unique senders. It is
  backed by strategic partners and investors including Bank Alfalah, MoneyGram,
  Mastercard, and 500 Global. Jingle Pay operates as a consumer mobile app
  (iOS and Android) and does not currently publish a public developer API, SDK,
  or developer portal.
